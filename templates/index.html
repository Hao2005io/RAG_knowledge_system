<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        高中数学知识库问答系统
    </title>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>

        body{
            width:800px;
            margin:auto;
            font-family:Arial;
        }

        h1{
            text-align:center;
        }

        #question{
            width:600px;
            height:40px;
            font-size:18px;
        }

        button{
            height:40px;
            font-size:18px;
        }

        #answer{
            margin-top:20px;
            padding:20px;
            border-radius:10px;
            background:#f5f5f5;
            font-size:18px;
        }
    </style>
</head>


<body>

    <h1>
    高中数学知识库问答系统
    </h1>

    <input
        id="question"
        placeholder="请输入问题"
        style="width:400px;height:30px;"
    >

    <button onclick="ask()">
        提交
    </button>

    <h3>
        回答：
    </h3>

    <div id="answer">

    </div>

    <script>

        async function ask(){
            let question =
                document.getElementById("question").value;

            let response =
                await fetch(
                    "/ask",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body:JSON.stringify(
                        {
                            question:question
                        }
                        )

                }
            );


            let data =
                await response.json();

            document.getElementById("answer").innerHTML =
                data.answer;
            MathJax.typeset();

        }
    </script>

</body>

</html>
